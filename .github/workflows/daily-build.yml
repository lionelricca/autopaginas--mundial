name: Daily Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

    - name: Generate content
      run: |
        python 'AutoPaginas-Mundial-updated (1)/generator/generate.py'

    - name: Copy generated site to root docs
      run: |
        rm -rf docs
        cp -r 'AutoPaginas-Mundial-updated (1)/docs' docs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update generated content"
          git push
